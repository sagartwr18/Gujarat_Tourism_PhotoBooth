<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/gujarat-tourism-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gujarat Tourism</title>
    <meta name="description" content="Step into the Land of Legends! Experience real-time AI background replacement with Gujarat's iconic monuments, temples, and landscapes." />
    <!-- Google Fonts for Modern Minimalist Luxury Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Translate Script -->
    <script type="text/javascript">
      // The widget container lives outside #root (see <body>) so React never
      // unmounts it. Google's TranslateElement can only be constructed once per
      // element id, so we guard against re-initialisation and wait for the
      // container to exist before building the gadget.
      (function () {
        var initialized = false;

        window.googleTranslateElementInit = function () {
          var attempts = 0;

          (function tryInit() {
            var el = document.getElementById('google_translate_element');

            if (window.google && window.google.translate && el) {
              if (!initialized && el.children.length === 0) {
                initialized = true;
                new window.google.translate.TranslateElement({
                  pageLanguage: 'en',
                  includedLanguages: 'en,gu,hi,bn,te,mr,ta,ur,kn,ml,pa,es,fr,de,ja,zh-CN,ar,ru',
                  layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE,
                  autoDisplay: false
                }, 'google_translate_element');
              }
              return;
            }

            if (attempts++ < 100) {
              setTimeout(tryInit, 100);
            }
          })();
        };
      })();
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </head>
  <body>
    <!-- Google Translate container: intentionally outside #root so the widget
         survives page changes and is never re-initialised. -->
    <div id="google_translate_element" class="google-translate-box"></div>

    <!-- Moves the initialized Translate gadget into the landing navbar slot so
         it lines up with the logo and scrolls with the page. Only the parent
         changes; the container itself is never re-created. -->
    <script type="text/javascript">
      (function () {
        var container = document.getElementById('google_translate_element');
        if (!container) return;

        var scheduled = false;

        function place() {
          scheduled = false;
          var slot = document.getElementById('landing-translate-slot');
          var target = slot || document.body;

          if (container.parentNode !== target) {
            target.appendChild(container);
          }
        }

        function schedule() {
          if (scheduled) return;
          scheduled = true;
          window.requestAnimationFrame(place);
        }

        new MutationObserver(schedule).observe(document.body, {
          childList: true,
          subtree: true
        });

        schedule();
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
